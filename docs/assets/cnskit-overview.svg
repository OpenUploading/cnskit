<text x="512" y="512" class="s">State persists within an episode</text>
<rect x="36" y="535" width="550" height="94" rx="10" fill="#ffffff" stroke="#d9e1e7"/>
<rect x="604" y="535" width="560" height="94" rx="10" fill="#ffffff" stroke="#d9e1e7"/>
<text x="57" y="561" class="label">TRAIN / EVALUATE</text><text x="57" y="585" class="b">Episodes → masked loss → TBPTT → held-out selection</text><text x="57" y="610" class="s">Readout · adapters · bounded dynamics  |  train-only normalization</text>
<text x="627" y="561" class="label">EXPORT / INFER</text><text x="627" y="585" class="b">Verified bundle → sequence or step → output + next state</text><text x="627" y="610" class="s">No pickle · explicit channel order · graph fingerprint · local execution</text>
<text x="36" y="652" class="s">Anatomy provides structure. Dynamics and task mappings are model choices; biological fidelity requires separate evaluation.</text>
