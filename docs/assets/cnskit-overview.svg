<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="title desc">
<title id="title">CNSKit: from connectome to custom task</title><desc id="desc">Verified anatomy feeds a fixed sparse recurrent model. Train input and output adapters on held-out episodes; export graph-bound checkpoints for stateful inference.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#637e86" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="672" rx="18" fill="#f7f8fa"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#223641}.label{font-size:11px;letter-spacing:1.8px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:14px;fill:#536b76}.s{font-size:12px;fill:#617784}.mono{font-family:Consolas,monospace;font-size:14px}.line{stroke:#637e86;stroke-width:1.8;fill:none;marker-end:url(#a)}</style>
<text x="36" y="37" class="label" fill="#347d82">UPLOADING / OPEN RESEARCH SOFTWARE</text>
<text x="36" y="83" style="font-size:38px;font-weight:700">CNSKit</text>
<text x="217" y="82" style="font-size:25px;fill:#536b76">Connectome models for custom tasks</text>
<text x="36" y="115" class="b">One explicit graph. Task-specific adaptation. Portable, stateful inference.</text>
<rect x="36" y="145" width="1128" height="66" rx="10" fill="#e8eeeb"/>
<text x="58" y="172" class="label">ANATOMICAL PRIOR</text><text x="58" y="194" class="b">MaleCNS · traced cells</text>
<text x="322" y="172" class="mono">W[post, pre]</text><text x="322" y="194" class="b">Directed synapse counts → normalized sparse weights</text>
<text x="872" y="172" class="label">TRACEABLE BY DESIGN</text><text x="872" y="194" class="b">Body IDs · source hashes · graph scope</text>
<path d="M605 211V233" class="line"/>
