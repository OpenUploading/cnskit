[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cns-tinker"
version = "0.2.4"
description = "Sparse connectome task training and stateful inference for MaleCNS experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.scripts]
cns-tinker = "cns_tinker.cli:main"
cnskit = "cnskit.cli:main"

[project.urls]
Repository = "https://github.com/OpenUploading/cnskit"
Documentation = "https://github.com/OpenUploading/cnskit/tree/main/docs"
Issues = "https://github.com/OpenUploading/cnskit/issues"

[project.optional-dependencies]
train = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10", "build>=1"]
malecns = ["scipy>=1.11", "pyarrow>=14", "pandas>=2"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
server-test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["cns_tinker*", "cnskit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
